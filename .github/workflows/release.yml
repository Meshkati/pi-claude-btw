name: Release

# release-please reads the conventional commits on main (feat:, fix:, ...) and keeps a
# release PR open with the next version and CHANGELOG. Merging that PR tags the release,
# and the publish job then puts the same commit on npm.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }} to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing once it is set up
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use npm 11.5.1 or newer (needed for trusted publishing)
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run verify:package
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          # Leave the NPM_TOKEN secret unset once npm trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
