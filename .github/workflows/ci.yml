name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test against ${{ matrix.pi }} pi
    runs-on: ubuntu-latest
    # The newest pi release is an early warning for upstream API changes, not a gate.
    continue-on-error: ${{ matrix.pi == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        pi: [locked, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Switch to the newest pi release
        if: matrix.pi == 'latest'
        run: npm install --no-save @earendil-works/pi-coding-agent@latest
      - run: npm run check
      - run: npm test
      - run: npm run verify:package
